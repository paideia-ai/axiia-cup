<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>02 全幅封面 · 原版三音 — Axiia Cup</title>
    <style>
    .achievement-preview {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 48px 24px 200px;
    }
    .achievement-preview-brand {
      color: var(--foreground-subtle);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .18em;
      margin-bottom: 38px;
    }
    .achievement-preview-kicker {
      color: #c8a079;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .achievement-preview h1 {
      font-size: clamp(24px, 4vw, 32px);
      line-height: 1.45;
      font-weight: 600;
      letter-spacing: -.025em;
      margin: 0 0 14px;
    }
    .achievement-preview-intro {
      color: var(--foreground-subtle);
      font-size: 14px;
      line-height: 1.9;
      margin: 0 0 30px;
    }
    .achievement-preview-controls {
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }
    .achievement-preview-controls label {
      display: block;
      margin-bottom: 10px;
      color: var(--foreground);
      font-size: 13px;
    }
    .achievement-preview-row {
      display: flex;
      gap: 12px;
      align-items: stretch;
    }
    .achievement-preview select {
      flex: 1;
      min-width: 0;
      width: 100%;
      padding: 11px 34px 11px 12px;
      border: 1px solid #4a4138;
      border-radius: 5px;
      background: #201d19;
      color: var(--foreground);
      font: inherit;
      font-size: 13px;
      min-height: 44px;
    }
    .achievement-preview-play {
      min-height: 44px;
      padding: 10px 18px;
      border: 1px solid #94673f;
      border-radius: 5px;
      background: #39281d;
      color: #f3d2b4;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .achievement-preview-play:hover {
      background: #493321;
    }
    .achievement-preview-note {
      margin: 16px 0 0;
      color: var(--foreground-subtle);
      font-size: 12px;
      line-height: 1.8;
    }
    .achievement-preview-guide {
      margin: 24px 0;
      padding-left: 18px;
      color: var(--foreground-subtle);
      font-size: 13px;
      line-height: 2;
    }
    .achievement-preview-links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px 24px;
      padding-top: 23px;
      border-top: 1px solid var(--border);
    }
    .achievement-preview-links a {
      color: #d2ae8b;
      font-size: 13px;
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .achievement-preview :focus-visible {
      outline: 2px solid #e6b481;
      outline-offset: 4px;
    }
    @media (max-width: 480px) {
      .achievement-preview {
        padding: 30px 18px 200px;
      }
      .achievement-preview-brand {
        margin-bottom: 28px;
      }
      .achievement-preview-controls {
        padding: 18px;
      }
      .achievement-preview-row {
        flex-direction: column;
      }
      .achievement-preview-play {
        width: 100%;
      }
      .achievement-preview-intro {
        font-size: 13px;
      }
    }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
