<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AXIIA CUP · 样式前后对照</title>
    <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #101010;
      color: #e7e7e7;
      font: 14px/1.5 system-ui, sans-serif;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      border-bottom: 1px solid #343434;
    }
    h1 {
      margin: 0 auto 0 0;
      font-size: 17px;
      font-weight: 600;
    }
    label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #aaa;
    }
    select {
      font: inherit;
      color: #eee;
      background: #222;
      border: 1px solid #484848;
      border-radius: 6px;
      padding: 7px;
    }
    a {
      color: #c7c7c7;
      text-decoration: none;
    }
    :focus-visible {
      outline: 2px solid #c7c7c7;
      outline-offset: 3px;
    }
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 16px;
    }
    section {
      min-width: 0;
      border: 1px solid #343434;
      border-radius: 9px;
      overflow: hidden;
    }
    h2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
      margin: 0;
      padding: 12px 16px;
      background: #1c1c1c;
    }
    .viewport {
      height: calc(100vh - 156px);
      min-height: 500px;
      overflow: hidden;
    }
    iframe {
      display: block;
      border: 0;
      transform-origin: top left;
      background: #0c0c0c;
    }
    @media (max-width: 700px) {
      main {
        grid-template-columns: 1fr;
      }
      .viewport {
        height: 650px;
      }
      header {
        padding: 16px;
        gap: 10px;
      }
      h1 {
        width: 100%;
      }
    }
    </style>
  </head>
  <body>
    <header>
      <h1>AXIIA CUP · 样式前后对照</h1>
      <label>页面<select id="page">
        <option value="/scenarios">场景</option>
        <option value="/scenarios/shangyang-court">场景详情</option>
        <option value="/tournaments">排名</option>
        <option value="/tournaments/41">积分榜</option>
        <option value="/matches">历史</option>
        <option value="/matches/9001">对战详情</option>
        <option value="/my-agents">我的智能体</option>
      </select></label>
      <label>对照<select id="before"><option value="original">main + PR #170 · 1040px</option></select></label>
      <label>尺寸<select id="size"><option value="1440">桌面</option><option value="390">手机</option></select></label>
    </header>
    <main>
      <section>
        <h2><span id="before-label">main + PR #170</span><a id="before-link" target="_blank" rel="noopener">单独打开 ↗</a></h2>
        <div class="viewport">
          <iframe id="left" title="调整前的页面"></iframe>
        </div>
      </section>
      <section>
        <h2>克制版样式<a id="after-link" target="_blank" rel="noopener">单独打开 ↗</a></h2>
        <div class="viewport">
          <iframe id="right" title="克制版样式的页面"></iframe>
        </div>
      </section>
    </main>
    <script type="module">
    const page = document.querySelector('#page')
    const before = document.querySelector('#before')
    const size = document.querySelector('#size')
    const frames = [...document.querySelectorAll('iframe')]
    function resize() {
      for (const frame of frames) {
        const host = frame.parentElement
        const width = Number(size.value)
        const scale = host.clientWidth / width
        frame.style.width = `${width}px`
        frame.style.height = `${host.clientHeight / scale}px`
        frame.style.transform = `scale(${scale})`
      }
    }
    function navigate() {
      const urls = [
        `./demo.html?style=${before.value}#${page.value}`,
        `./demo.html?style=polished#${page.value}`,
      ]
      frames.forEach((frame, i) => {
        frame.src = urls[i]
      })
      document.querySelector('#before-link').href = urls[0]
      document.querySelector('#after-link').href = urls[1]
      document.querySelector('#before-label').textContent =
        before.selectedOptions[0].text
    }
    page.addEventListener('change', navigate)
    before.addEventListener('change', navigate)
    size.addEventListener('change', resize)
    new ResizeObserver(resize).observe(document.querySelector('main'))
    navigate()
    resize()
    </script>
  </body>
</html>
