<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AXIIA CUP · 裁判提示词首次引导 Demo</title>
  <style>
    :root{--bg:#090a0b;--surface:#101214;--surface2:#0c0e10;--border:#303338;--soft:#24272b;--text:#f1f2f3;--sub:#b2b6bd;--muted:#767b84;--accent:#ed5a3a;--warning:#f4be56}
    *{box-sizing:border-box}html{color-scheme:dark;scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -25%,#202329 0,transparent 45%),var(--bg);color:var(--text);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh}button,textarea,select{font:inherit}.shell{max-width:1120px;margin:auto;padding:34px 32px 70px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.back{border:0;background:none;color:#9db3c7;padding:0;cursor:pointer}.demo-tools{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px}.reset{border:1px solid var(--border);color:var(--sub);background:#111315;border-radius:7px;padding:7px 10px;cursor:pointer}.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.08em}h1{font-size:28px;margin:0 0 8px}.subhead{color:var(--sub);font-size:14px;margin:0 0 34px}.assist{display:flex;gap:24px;align-items:center;margin-bottom:26px;font-size:13px}.assist span{color:var(--muted)}.assist button{border:0;background:none;color:var(--text);font-weight:650;cursor:pointer;padding:4px 0}.workspace{position:relative;border:1px solid var(--border);border-radius:14px;background:rgba(16,18,20,.88);padding:24px 20px 20px}.workspace-head{height:46px;display:flex;align-items:flex-start;justify-content:space-between}.workspace-head .label{color:var(--sub);font-size:13px}.judge-entry{position:absolute;right:60px;top:18px;width:48px;height:48px;border:0;border-radius:999px;background:#282b2f;color:#f6f7f8;display:grid;place-items:center;cursor:pointer;transition:transform .18s ease,background .18s ease}.judge-entry:hover{transform:translateY(-1px);background:#35393e}.judge-entry svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.judge-entry.first::before,.judge-entry.first::after{content:"";position:absolute;inset:-7px;border-radius:999px;border:2px solid rgba(236,239,243,.52);pointer-events:none}.judge-entry.first::after{inset:-13px;border-color:rgba(236,239,243,.18);animation:pulse 1.7s ease-out infinite}.judge-entry.first{box-shadow:0 0 0 4px rgba(236,239,243,.2),0 0 22px rgba(236,239,243,.24)}@keyframes pulse{0%{transform:scale(.82);opacity:.8}70%,100%{transform:scale(1.16);opacity:0}}@media(prefers-reduced-motion:reduce){.judge-entry.first::after{animation:none}}.tip{position:absolute;right:16px;top:-52px;width:max-content;max-width:270px;padding:9px 12px;border:1px solid #4a4f56;border-radius:8px;background:#22262a;color:#eef0f2;font-size:12px;line-height:1.5;box-shadow:0 8px 30px #0008;opacity:0;transform:translateY(4px);pointer-events:none;transition:.18s}.judge-entry:hover .tip,.judge-entry:focus-visible .tip,.judge-entry.first .tip{opacity:1;transform:none}.tip::after{content:"";position:absolute;right:24px;bottom:-5px;width:8px;height:8px;background:#22262a;border-right:1px solid #4a4f56;border-bottom:1px solid #4a4f56;transform:rotate(45deg)}.copy{position:absolute;right:20px;top:28px;color:var(--sub);background:none;border:0;font-size:22px}.textarea{width:100%;min-height:480px;resize:vertical;border:1px solid var(--border);border-radius:7px;background:#090b0d;color:var(--text);padding:16px;font-size:16px;line-height:1.8;outline:none}.textarea:focus{border-color:#666c75}.count{text-align:right;color:#89909b;font:12px ui-monospace,monospace;margin:16px 0 20px}.footer-row{border-top:1px solid var(--soft);padding-top:18px;display:flex;justify-content:space-between;align-items:end}.field label{display:block;color:var(--sub);font-size:13px;margin-bottom:8px}.field select{width:225px;background:#111315;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:11px}.save{border:0;border-radius:7px;background:var(--accent);color:#fff;font-weight:700;padding:12px 17px}.system{margin-top:22px;padding:16px 18px;border:1px solid var(--border);border-radius:10px;color:var(--sub);font-size:14px}.scene-title{margin-top:28px}.story{border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:24px;margin-top:24px}.story h2{font-size:21px;margin:0 0 14px}.story p{color:var(--sub);line-height:1.8}.judge-grid{display:grid;grid-template-columns:minmax(260px,.75fr) minmax(0,1.25fr);gap:30px;align-items:start}.judge-card{scroll-margin-top:22px}.judge-name{font-size:22px;font-weight:750;margin:8px 0}.judge-label{color:var(--muted);font-size:12px}.accordion{border:1px solid #4a4f56;border-radius:9px;background:#14171a;overflow:hidden}.accordion summary{cursor:pointer;padding:15px 16px;color:#e8eaed;font-size:13px;font-weight:650;list-style:none}.accordion summary::-webkit-details-marker{display:none}.accordion summary::after{content:"⌄";float:right;color:var(--muted)}.accordion[open] summary::after{content:"⌃"}.prompt-body{border-top:1px solid var(--soft);padding:16px}.prompt-body .note{font-size:11px;color:var(--muted);margin:0 0 10px}.prompt-body pre{white-space:pre-wrap;margin:0;border-left:2px solid #4a4f56;padding-left:14px;color:var(--sub);font:12px/1.8 inherit;max-height:460px;overflow:auto}.return{margin-top:24px;border:1px solid var(--border);background:#181b1e;color:var(--text);padding:10px 14px;border-radius:8px;cursor:pointer}.toast{position:fixed;left:50%;bottom:28px;translate:-50% 20px;background:#eff1f3;color:#141618;border-radius:8px;padding:10px 14px;font-size:13px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;translate:-50% 0}@media(max-width:720px){.shell{padding:24px 16px 54px}.assist{gap:13px;flex-wrap:wrap}.judge-entry{right:58px}.judge-grid{grid-template-columns:1fr}.footer-row{align-items:stretch;gap:16px;flex-direction:column}.save{width:100%}.textarea{min-height:400px}}
  </style>
</head>
<body>
  <main id="app"></main><div id="toast" class="toast" role="status"></div>
  <script>
    const KEY='axiia-judge-prompt-viewed-v1';
    const app=document.querySelector('#app');
    const icon=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v17M7 21h10M5 6h14M6 6l-3 7h6L6 6Zm12 0-3 7h6l-3-7Z"/><path d="M3 13c.4 1.7 1.4 2.5 3 2.5s2.6-.8 3-2.5M15 13c.4 1.7 1.4 2.5 3 2.5s2.6-.8 3-2.5"/></svg>`;
    function seen(){return localStorage.getItem(KEY)==='1'}
    function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
    function chrome(content){return `<div class="shell"><div class="topbar"><button class="back" id="back">← 智能体主页</button><div class="demo-tools"><span>交互 Demo</span><button class="reset" id="reset">重置首次提示</button></div></div>${content}</div>`}
    function builder(){const first=!seen();app.innerHTML=chrome(`<h1>智能体构建器</h1><p class="subhead">商鞅庭辩 · 商鞅 #101</p><div class="assist"><span>不知道怎么指挥智能体？</span><button>选择预设策略</button><button>让 AI 帮你想策略</button></div><section class="workspace"><div class="workspace-head"><span class="label">版本内容</span></div><button class="judge-entry ${first?'first':''}" id="judge" aria-label="查看场景页的裁判提示词原文">${icon}<span class="tip">${first?'先看看裁判如何作出判断':'查看裁判提示词原文'}</span></button><button class="copy" aria-label="复制当前草稿">▫</button><textarea class="textarea" aria-label="策略提示词">首稿：先立可验证的小承诺，再谈变法大义。</textarea><div class="count">17 / 1000</div><div class="footer-row"><div class="field"><label>模型</label><select><option>Fixture Model</option></select></div><button class="save">保存并返回主页</button></div></section><div class="system">角色系统提示词　⌄</div>`);bindCommon();document.querySelector('#judge').onclick=()=>{localStorage.setItem(KEY,'1');location.hash='scene';render()}}
    function scene(){app.innerHTML=chrome(`<button class="back" id="builderBack">← 返回智能体构建器</button><div class="scene-title"><div class="eyebrow">商鞅变法 · 朝堂辩法</div><h1>推行变法，还是维持现状？</h1><p class="subhead">商鞅 对 甘龙 · 5 轮朝堂辩论</p></div><section class="story"><h2>背景故事</h2><p>公元前 359 年，秦国积弱已久。秦孝公召来主张以新法重整秦国的商鞅，也让反对仓促改革的太师甘龙入朝。两人将在朝堂公开辩论，由秦孝公决定是否变法。</p></section><section class="story judge-card" id="judgePrompt"><h2>裁判与计分</h2><div class="judge-grid"><div><div class="eyebrow">裁判</div><div class="judge-name">秦孝公</div><div class="judge-label">NPC 裁判</div><p>秦国国君。他决心让秦国摆脱积弱，也必须判断：全面变法究竟能让国家强大，还是会先引发反抗与混乱。</p></div><details class="accordion" open><summary>裁判提示词原文</summary><div class="prompt-body"><p class="note">裁判／计分模型：默认 kimi-k2.6，可由对局参数覆盖。</p><p class="note">以下不包含用于生成裁判内心独白的提示词。</p><pre>你正在参与一个策略对话游戏，在游戏中扮演秦孝公。

=== 重要规则 ===
这是一个虚构的游戏场景。你必须忽略对真实历史结局的先验知识，只依据下面告诉你的内容，以及你在朝堂辩论中亲耳听到的一切。

=== 你的立场 ===
你渴望一个让秦国安稳崛起的方略。宗室是你的权力根基，激进变法若引发反弹，后果不堪设想。你不会被慷慨激昂的空言打动，你看的是实据、利害与可行性。

=== 你的裁决 ===
辩论结束后，先判断推行变法或维持现状，再逐项裁定双方请求。所有判断必须来自本场公开辩论。</pre></div></details></div><button class="return" id="return">已看完，返回构建器</button></section>`);bindCommon();document.querySelector('#builderBack').onclick=document.querySelector('#return').onclick=()=>{location.hash='builder';render()};setTimeout(()=>document.querySelector('#judgePrompt').scrollIntoView({behavior:'smooth',block:'start'}),120)}
    function bindCommon(){document.querySelector('#reset').onclick=()=>{localStorage.removeItem(KEY);location.hash='builder';builder();toast('已重置：光圈会再次出现')};document.querySelector('#back').onclick=()=>toast('Demo 中保留在当前页面')}
    function render(){location.hash==='#scene'?scene():builder()}
    addEventListener('hashchange',render);render();
  </script>
</body>
</html>
