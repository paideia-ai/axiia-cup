name: Build and Push to ACR

on:
  push:
    branches: [master]
    paths:
      - "apps/**"
      - "packages/**"
      - "deploy/Dockerfile.*"
      - "deploy/docker-compose.acr.yml"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ALIBABA_CLOUD_REGION_ID: cn-hangzhou
  ACR_INSTANCE_ID: cri-qvdxmkdj3dh8s2oe
  REGISTRY_URL: second-acr-registry.cn-hangzhou.cr.aliyuncs.com
  DEPLOY_WEBHOOK_URL: https://axiia-cup.isofucius.cn/_deploy

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - run: bun install --frozen-lockfile

      - name: Format check
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun test
        working-directory: apps/api

  build-and-push:
    name: Build and Push
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Aliyun credentials
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          oidc-provider-arn: acs:ram::1805039414054707:oidc-provider/GitHub
          role-to-assume: acs:ram::1805039414054707:role/githubactions-axiiacup

      - name: Install Aliyun CLI
        uses: aliyun/setup-aliyun-cli-action@v1

      - name: Login to ACR
        run: |
          auth_info=$(aliyun cr GetAuthorizationToken --InstanceId ${{ env.ACR_INSTANCE_ID }})
          username=$(echo $auth_info | jq -r .TempUsername)
          password=$(echo $auth_info | jq -r .AuthorizationToken)
          echo $password | docker login --username $username --password-stdin ${{ env.REGISTRY_URL }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: ${{ env.REGISTRY_URL }}/apps/axiia-cup-api:${{ github.sha }}
          provenance: false

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          tags: ${{ env.REGISTRY_URL }}/apps/axiia-cup-web:${{ github.sha }}
          provenance: false

  deploy:
    name: Deploy
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Generate deploy token
        id: token
        run: |
          # Create JWT payload
          NOW=$(date +%s)
          EXP=$((NOW + 300))  # 5 minute expiry
          
          # Create header and payload
          HEADER=$(echo -n '{"alg":"HS256","typ":"JWT"}' | base64 -w0 | tr '+/' '-_' | tr -d '=')
          PAYLOAD=$(echo -n "{\"tag\":\"${{ github.sha }}\",\"repo\":\"${{ github.repository }}\",\"iat\":${NOW},\"exp\":${EXP}}" | base64 -w0 | tr '+/' '-_' | tr -d '=')
          
          # Create signature
          SIGNATURE=$(echo -n "${HEADER}.${PAYLOAD}" | openssl dgst -sha256 -hmac "${{ secrets.DEPLOY_WEBHOOK_SECRET }}" -binary | base64 -w0 | tr '+/' '-_' | tr -d '=')
          
          # Combine into JWT
          JWT="${HEADER}.${PAYLOAD}.${SIGNATURE}"
          echo "jwt=${JWT}" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy
        run: |
          response=$(curl -s -w "\n%{http_code}" --max-time 120 -X POST "${{ env.DEPLOY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ steps.token.outputs.jwt }}" \
            -H "Content-Type: application/json")
          
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          
          echo "Response: $body"
          echo "Status: $status"
          
          if [ "$status" != "200" ]; then
            echo "Deploy failed with status $status"
            exit 1
          fi
