name: Build

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ALIBABA_CLOUD_REGION_ID: cn-hangzhou
  ACR_INSTANCE_ID: cri-qvdxmkdj3dh8s2oe
  REGISTRY_URL: second-acr-registry.cn-hangzhou.cr.aliyuncs.com
  DEPLOY_WEBHOOK_URL: https://axiia-cup.isofucius.cn/_deploy

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      legacy_changed: ${{ steps.classify.outputs.legacy_changed }}
      v2_web_changed: ${{ steps.classify.outputs.v2_web_changed }}
      v2_scenarios_changed: ${{ steps.classify.outputs.v2_scenarios_changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            {
              echo "docs_only=false"
              echo "legacy_changed=true"
              echo "v2_web_changed=true"
              echo "v2_scenarios_changed=true"
            } >> "$GITHUB_OUTPUT"
            echo "Manual build: building every image from this commit"
            exit 0
          fi

          chmod +x .github/classify-changes.sh
          .github/classify-changes.sh

  build:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.legacy_changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Aliyun credentials
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          oidc-provider-arn: acs:ram::1805039414054707:oidc-provider/GitHub
          role-to-assume: acs:ram::1805039414054707:role/githubactions-axiiacup

      - name: Install Aliyun CLI
        uses: aliyun/setup-aliyun-cli-action@v1

      - name: Login to ACR
        run: |
          auth_info=$(aliyun cr GetAuthorizationToken --InstanceId ${{ env.ACR_INSTANCE_ID }})
          username=$(echo "$auth_info" | jq -r .TempUsername)
          password=$(echo "$auth_info" | jq -r .AuthorizationToken)
          echo "$password" | docker login --username "$username" --password-stdin ${{ env.REGISTRY_URL }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          build-args: |
            APP_BUILD_SHA=${{ github.sha }}
          tags: ${{ env.REGISTRY_URL }}/apps/axiia-cup-api:${{ github.sha }}
          provenance: false

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          tags: ${{ env.REGISTRY_URL }}/apps/axiia-cup-web:${{ github.sha }}
          provenance: false

  deploy_dev:
    name: Auto Deploy Dev
    runs-on: ubuntu-latest
    needs:
      - classify
      - build
    if: github.event_name == 'push' && needs.classify.outputs.legacy_changed == 'true' && needs.build.result == 'success'
    concurrency:
      group: axiia-cup-dev-deploy
      cancel-in-progress: true

    steps:
      - name: Generate deploy token
        id: token
        shell: bash
        run: |
          set -euo pipefail

          NOW=$(date +%s)
          EXP=$((NOW + 900))

          HEADER=$(echo -n '{"alg":"HS256","typ":"JWT"}' | base64 | tr -d '\n=' | tr '+/' '-_')
          PAYLOAD=$(printf '{"tag":"%s","target":"dev","repo":"%s","iat":%s,"exp":%s}' \
            '${{ github.sha }}' \
            '${{ github.repository }}' \
            "$NOW" \
            "$EXP" | base64 | tr -d '\n=' | tr '+/' '-_')
          SIGNATURE=$(printf '%s' "${HEADER}.${PAYLOAD}" | openssl dgst -sha256 -hmac '${{ secrets.DEPLOY_WEBHOOK_SECRET }}' -binary | base64 | tr -d '\n=' | tr '+/' '-_')

          echo "jwt=${HEADER}.${PAYLOAD}.${SIGNATURE}" >> "$GITHUB_OUTPUT"

      - name: Start dev deploy
        id: start
        shell: bash
        run: |
          set -euo pipefail

          response=$(curl -s -w "\n%{http_code}" --max-time 30 -X POST "${{ env.DEPLOY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ steps.token.outputs.jwt }}" \
            -H "Content-Type: application/json")

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)

          echo "Response: $body"
          echo "Status: $status"

          if [[ "$status" != "202" ]]; then
            echo "Dev deploy start failed with status $status"
            exit 1
          fi

          deployment_id=$(echo "$body" | jq -r '.deploymentId // empty')
          if [[ -z "$deployment_id" ]]; then
            echo "Missing deploymentId in start response"
            exit 1
          fi

          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "Started dev deployment $deployment_id"

      - name: Wait for dev deploy
        shell: bash
        run: |
          set -euo pipefail

          deployment_id='${{ steps.start.outputs.deployment_id }}'
          status_url="${{ env.DEPLOY_WEBHOOK_URL }}/status?id=${deployment_id}"

          for attempt in $(seq 1 120); do
            response=$(curl -s -w "\n%{http_code}" --max-time 30 "$status_url" \
              -H "Authorization: Bearer ${{ steps.token.outputs.jwt }}")

            body=$(echo "$response" | head -n -1)
            http_status=$(echo "$response" | tail -n 1)

            echo "Poll #$attempt HTTP $http_status: $body"

            if [[ "$http_status" != "200" ]]; then
              echo "Dev deploy status check failed with HTTP $http_status"
              exit 1
            fi

            deploy_status=$(echo "$body" | jq -r '.status // empty')
            case "$deploy_status" in
              success)
                echo "✅ Deployed dev for commit ${{ github.sha }}"
                exit 0
                ;;
              failed)
                error_message=$(echo "$body" | jq -r '.error // "unknown deploy failure"')
                echo "Dev deploy failed: $error_message"
                exit 1
                ;;
              accepted|running)
                sleep 5
                ;;
              *)
                echo "Unexpected deploy status: $deploy_status"
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for dev deploy $deployment_id"
          exit 1

  build_v2_web:
    name: Build and Push v2 Web
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.v2_web_changed == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Aliyun credentials
        uses: aliyun/configure-aliyun-credentials-action@v1
        with:
          oidc-provider-arn: acs:ram::1805039414054707:oidc-provider/GitHub
          role-to-assume: acs:ram::1805039414054707:role/githubactions-axiiacup

      - name: Install Aliyun CLI
        uses: aliyun/setup-aliyun-cli-action@v1

      - name: Login to ACR
        run: |
          auth_info=$(aliyun cr GetAuthorizationToken --InstanceId ${{ env.ACR_INSTANCE_ID }})
          username=$(echo "$auth_info" | jq -r .TempUsername)
          password=$(echo "$auth_info" | jq -r .AuthorizationToken)
          echo "$password" | docker login --username "$username" --password-stdin ${{ env.REGISTRY_URL }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push v2 web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: v2/deploy/Dockerfile.web
          push: true
          tags: ${{ env.REGISTRY_URL }}/apps/axiia-web2:${{ github.sha }}
          provenance: false

  deploy_v2_web:
    name: Auto Deploy v2 Web
    runs-on: ubuntu-latest
    needs:
      - classify
      - build_v2_web
    if: github.event_name == 'push' && needs.classify.outputs.v2_web_changed == 'true' && needs.build_v2_web.result == 'success'
    concurrency:
      group: axiia-web2-deploy
      cancel-in-progress: true

    steps:
      - name: Generate deploy token
        id: token
        shell: bash
        run: |
          set -euo pipefail

          NOW=$(date +%s)
          EXP=$((NOW + 900))

          HEADER=$(echo -n '{"alg":"HS256","typ":"JWT"}' | base64 | tr -d '\n=' | tr '+/' '-_')
          PAYLOAD=$(printf '{"tag":"%s","target":"web2","repo":"%s","iat":%s,"exp":%s}' \
            '${{ github.sha }}' \
            '${{ github.repository }}' \
            "$NOW" \
            "$EXP" | base64 | tr -d '\n=' | tr '+/' '-_')
          SIGNATURE=$(printf '%s' "${HEADER}.${PAYLOAD}" | openssl dgst -sha256 -hmac '${{ secrets.DEPLOY_WEBHOOK_SECRET }}' -binary | base64 | tr -d '\n=' | tr '+/' '-_')

          echo "jwt=${HEADER}.${PAYLOAD}.${SIGNATURE}" >> "$GITHUB_OUTPUT"

      - name: Start deploy
        id: start
        shell: bash
        run: |
          set -euo pipefail

          response=$(curl -s -w "\n%{http_code}" --max-time 30 -X POST "${{ env.DEPLOY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ steps.token.outputs.jwt }}" \
            -H "Content-Type: application/json")

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)

          echo "Response: $body"
          echo "Status: $status"

          if [[ "$status" != "202" ]]; then
            echo "v2 web deploy start failed with status $status"
            exit 1
          fi

          deployment_id=$(echo "$body" | jq -r '.deploymentId // empty')
          if [[ -z "$deployment_id" ]]; then
            echo "Missing deploymentId in start response"
            exit 1
          fi

          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "Started v2 web deployment $deployment_id"

      - name: Wait for deploy
        shell: bash
        run: |
          set -euo pipefail

          deployment_id='${{ steps.start.outputs.deployment_id }}'
          status_url="${{ env.DEPLOY_WEBHOOK_URL }}/status?id=${deployment_id}"

          for attempt in $(seq 1 120); do
            response=$(curl -s -w "\n%{http_code}" --max-time 30 "$status_url" \
              -H "Authorization: Bearer ${{ steps.token.outputs.jwt }}")

            body=$(echo "$response" | head -n -1)
            http_status=$(echo "$response" | tail -n 1)

            echo "Poll #$attempt HTTP $http_status: $body"

            if [[ "$http_status" != "200" ]]; then
              echo "v2 web deploy status check failed with HTTP $http_status"
              exit 1
            fi

            deploy_status=$(echo "$body" | jq -r '.status // empty')
            case "$deploy_status" in
              success)
                echo "✅ Deployed v2 web for commit ${{ github.sha }}"
                exit 0
                ;;
              failed)
                error_message=$(echo "$body" | jq -r '.error // "unknown deploy failure"')
                echo "v2 web deploy failed: $error_message"
                exit 1
                ;;
              accepted|running)
                sleep 5
                ;;
              *)
                echo "Unexpected deploy status: $deploy_status"
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for v2 web deploy $deployment_id"
          exit 1

  deploy_v2_scenarios:
    name: Deploy v2 Scenarios
    runs-on: ubuntu-latest
    needs: classify
    if: github.event_name == 'push' && needs.classify.outputs.v2_scenarios_changed == 'true'
    concurrency:
      group: axiia-scenarios-deploy
      cancel-in-progress: false
    # The OIDC assertion is the credential: no long-lived token is stored here.
    # The server trusts this exact subject, so only main can publish scenarios.
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: v2/scenarios

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.1"

      - name: Exchange the OIDC assertion for a short-lived token
        id: token
        env:
          AXIIA_BASE_URL: ${{ vars.AXIIA_BASE_URL }}
        run: |
          set -euo pipefail
          assertion="$(curl -sS --max-time 30 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AXIIA_BASE_URL" | jq -r '.value')"
          [ -n "$assertion" ] && [ "$assertion" != "null" ] || { echo "no OIDC assertion"; exit 1; }
          token="$(curl -sS --max-time 30 -X POST "$AXIIA_BASE_URL/v1/auth/federated" \
            -H 'content-type: application/json' \
            --data "$(jq -nc --arg a "$assertion" '{assertion: $a}')" | jq -r '.accessToken // empty')"
          [ -n "$token" ] || { echo "federated exchange refused"; exit 1; }
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Push scenarios
        env:
          AXIIA_BASE_URL: ${{ vars.AXIIA_BASE_URL }}
          AXIIA_TOKEN: ${{ steps.token.outputs.token }}
        run: deno task push
