name: Deploy

on:
  push:
    tags:
      - 'release/*'

env:
  DEPLOY_WEBHOOK_URL: https://axiia-cup.isofucius.cn/_deploy

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Extract commit SHA from tag
        id: tag
        run: |
          SHA=$(git ls-remote https://github.com/${{ github.repository }} ${{ github.ref }} | cut -f1)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Deploying tag ${{ github.ref_name }} (commit ${SHA})"

      - name: Generate deploy token
        id: token
        run: |
          NOW=$(date +%s)
          EXP=$((NOW + 900))

          HEADER=$(echo -n '{"alg":"HS256","typ":"JWT"}' | base64 -w0 | tr '+/' '-_' | tr -d '=')
          PAYLOAD=$(echo -n "{\"tag\":\"${{ steps.tag.outputs.sha }}\",\"target\":\"prod\",\"repo\":\"${{ github.repository }}\",\"iat\":${NOW},\"exp\":${EXP}}" | base64 -w0 | tr '+/' '-_' | tr -d '=')
          SIGNATURE=$(echo -n "${HEADER}.${PAYLOAD}" | openssl dgst -sha256 -hmac "${{ secrets.DEPLOY_WEBHOOK_SECRET }}" -binary | base64 -w0 | tr '+/' '-_' | tr -d '=')

          echo "jwt=${HEADER}.${PAYLOAD}.${SIGNATURE}" >> "$GITHUB_OUTPUT"

      - name: Start deploy
        id: start
        run: |
          response=$(curl -s -w "\n%{http_code}" --max-time 30 -X POST "${{ env.DEPLOY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ steps.token.outputs.jwt }}" \
            -H "Content-Type: application/json")

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)

          echo "Response: $body"
          echo "Status: $status"

          if [ "$status" != "202" ]; then
            echo "Deploy start failed with status $status"
            exit 1
          fi

          deployment_id=$(echo "$body" | jq -r '.deploymentId // empty')
          if [ -z "$deployment_id" ]; then
            echo "Missing deploymentId in start response"
            exit 1
          fi

          echo "deployment_id=${deployment_id}" >> "$GITHUB_OUTPUT"
          echo "Started deployment ${deployment_id}"

      - name: Wait for deploy
        run: |
          deployment_id='${{ steps.start.outputs.deployment_id }}'
          status_url="${{ env.DEPLOY_WEBHOOK_URL }}/status?id=${deployment_id}"

          for attempt in $(seq 1 120); do
            response=$(curl -s -w "\n%{http_code}" --max-time 30 "$status_url" \
              -H "Authorization: Bearer ${{ steps.token.outputs.jwt }}")

            body=$(echo "$response" | head -n -1)
            http_status=$(echo "$response" | tail -n 1)

            echo "Poll #$attempt HTTP $http_status: $body"

            if [ "$http_status" != "200" ]; then
              echo "Deploy status check failed with HTTP $http_status"
              exit 1
            fi

            deploy_status=$(echo "$body" | jq -r '.status // empty')
            case "$deploy_status" in
              success)
                echo "✅ Deployed ${{ github.ref_name }} successfully"
                exit 0
                ;;
              failed)
                error_message=$(echo "$body" | jq -r '.error // "unknown deploy failure"')
                echo "Deploy failed: $error_message"
                exit 1
                ;;
              accepted|running)
                sleep 5
                ;;
              *)
                echo "Unexpected deploy status: $deploy_status"
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for deployment $deployment_id"
          exit 1
