name: Deploy

on:
  push:
    tags:
      - 'release/*'

env:
  DEPLOY_WEBHOOK_URL: https://axiia-cup.isofucius.cn/_deploy

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Extract commit SHA from tag
        id: tag
        run: |
          # Get the commit SHA that the tag points to
          SHA=$(git ls-remote https://github.com/${{ github.repository }} ${{ github.ref }} | cut -f1)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Deploying tag ${{ github.ref_name }} (commit ${SHA})"

      - name: Generate deploy token
        id: token
        run: |
          NOW=$(date +%s)
          EXP=$((NOW + 300))
          
          HEADER=$(echo -n '{"alg":"HS256","typ":"JWT"}' | base64 -w0 | tr '+/' '-_' | tr -d '=')
          PAYLOAD=$(echo -n "{\"tag\":\"${{ steps.tag.outputs.sha }}\",\"repo\":\"${{ github.repository }}\",\"iat\":${NOW},\"exp\":${EXP}}" | base64 -w0 | tr '+/' '-_' | tr -d '=')
          SIGNATURE=$(echo -n "${HEADER}.${PAYLOAD}" | openssl dgst -sha256 -hmac "${{ secrets.DEPLOY_WEBHOOK_SECRET }}" -binary | base64 -w0 | tr '+/' '-_' | tr -d '=')
          
          echo "jwt=${HEADER}.${PAYLOAD}.${SIGNATURE}" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy
        run: |
          response=$(curl -s -w "\n%{http_code}" --max-time 120 -X POST "${{ env.DEPLOY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ steps.token.outputs.jwt }}" \
            -H "Content-Type: application/json")
          
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          
          echo "Response: $body"
          echo "Status: $status"
          
          if [ "$status" != "200" ]; then
            echo "Deploy failed with status $status"
            exit 1
          fi
          
          echo "✅ Deployed ${{ github.ref_name }} successfully"
