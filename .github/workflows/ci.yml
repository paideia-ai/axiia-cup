name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          chmod +x .github/classify-changes.sh
          .github/classify-changes.sh

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - run: bun install --frozen-lockfile

      - name: Format check
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun test
        working-directory: apps/api

  check:
    name: Check
    runs-on: ubuntu-latest
    needs:
      - classify
      - ci
    if: always()

    steps:
      - name: Enforce PR gate
        shell: bash
        env:
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          set -euo pipefail

          echo "docs_only=$DOCS_ONLY"
          echo "ci=$CI_RESULT"

          if [[ "$DOCS_ONLY" == "true" ]]; then
            echo "Docs-only change detected; heavy CI skipped."
            exit 0
          fi

          if [[ "$CI_RESULT" != "success" ]]; then
            echo "CI job must pass."
            exit 1
          fi

          echo "Required CI gate passed."
