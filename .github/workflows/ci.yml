name: CI

on:
  push:
    branches: [master]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'deploy/**'
      - 'bun.lockb'
      - 'turbo.json'
      - 'package.json'
      - '.github/workflows/**'
  pull_request:
    branches: [master]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'deploy/**'
      - 'bun.lockb'
      - 'turbo.json'
      - 'package.json'
      - '.github/workflows/**'

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - run: bun install --frozen-lockfile

      - name: Format check
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun test
        working-directory: apps/api
